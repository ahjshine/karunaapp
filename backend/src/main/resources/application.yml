spring:
  application:
    name: medsentinel

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/medsentinel}

  thymeleaf:
    cache: false

server:
  port: 8080
  servlet:
    session:
      timeout: 30m

detection:
  sweep-interval-ms: 30000
  window-minutes: 10
  failed-login-threshold: 5
  failed-login-window-minutes: 5

logging:
  level:
    com.medsentinel: DEBUG
