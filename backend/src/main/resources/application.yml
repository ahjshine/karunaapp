spring:
  application:
    name: medsentinel

  datasource:
    url: jdbc:mysql://localhost:3306/medsentinel?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: app_user
    password: ${DB_PASS:medsentinel123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  thymeleaf:
    cache: false

server:
  port: 8080
  servlet:
    session:
      timeout: 30m

detection:
  sweep-interval-ms: 30000
  window-minutes: 10
  failed-login-threshold: 5
  failed-login-window-minutes: 5

logging:
  level:
    com.medsentinel: DEBUG
