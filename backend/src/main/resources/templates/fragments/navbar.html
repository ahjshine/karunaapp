<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Fragment</title>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/home}">🛡️ MedSentinel</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" sec:authorize="hasAnyRole('DOCTOR','NURSE','BILLING','RECEPTIONIST')">
                    <a class="nav-link" th:href="@{/patients}">Patients</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('REVIEWER','ADMIN')">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('REVIEWER','ADMIN')">
                    <a class="nav-link" th:href="@{/dashboard/logs}">Log Explorer</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/users}">Users</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/baselines}">Baselines</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','REVIEWER')">
                    <a class="nav-link" th:href="@{/simulator}">Simulator</a>
                </li>
            </ul>
            <span class="navbar-text me-3">
                <span class="badge bg-secondary" sec:authentication="principal.roleName">ROLE</span>
                <span sec:authentication="name">user</span>
            </span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
