<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patients · MedSentinel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head><body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h2">Patient Directory</h1><form th:action="@{/patients/search}" class="d-flex"><input name="q" th:value="${query}" class="form-control me-2" placeholder="Search patient name"><button class="btn btn-primary">Search</button></form></div><div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>ID</th><th>Name</th><th>Date of birth</th><th>Ward ID</th><th></th></tr></thead><tbody><tr th:each="patient : ${patients}"><td th:text="${patient.patientId}">1</td><td th:text="${patient.name}">Name</td><td th:text="${patient.dob}">DOB</td><td th:text="${patient.wardId}">1</td><td><a th:href="@{/patients/{id}(id=${patient.patientId})}" class="btn btn-sm btn-outline-primary">View records</a></td></tr><tr th:if="${#lists.isEmpty(patients)}"><td colspan="5" class="text-center text-muted py-4">No patients found.</td></tr></tbody></table></div></div></main></body></html>
