<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient Record · MedSentinel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head><body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><a th:href="@{/patients}" class="btn btn-sm btn-outline-secondary mb-3">← Patient directory</a><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Success</div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Error</div><div class="card shadow-sm mb-4"><div class="card-body"><h1 class="h2" th:text="${patient.name}">Patient</h1><p class="text-muted mb-0">Patient #<span th:text="${patient.patientId}">1</span> · DOB <span th:text="${patient.dob}">DOB</span> · Ward ID <span th:text="${patient.wardId}">1</span></p></div></div><div th:each="type : ${T(com.medsentinel.patient.PatientRecord.RecordType).values()}" class="card shadow-sm mb-3"><div class="card-header bg-white"><strong th:text="${type}">CLINICAL</strong></div><div class="card-body" th:if="${records.containsKey(type)}"><div th:each="record : ${records.get(type)}" class="record-content" th:text="${record.content}">record</div></div><div class="card-body text-muted" th:if="${denied.containsKey(type)}">Access denied: <span th:text="${denied.get(type)}">reason</span></div></div><section th:if="${userRole == 'DOCTOR'}" class="card border-warning shadow-sm"><div class="card-header bg-warning-subtle"><strong>Emergency break-glass access</strong></div><div class="card-body"><form th:action="@{/patients/{id}/break-glass(id=${patient.patientId})}" method="post" class="row g-2"><div class="col-md-9"><input name="justification" class="form-control" minlength="10" required placeholder="Emergency justification (minimum 10 characters)"></div><div class="col-md-3"><button class="btn btn-warning w-100">Break glass</button></div></form></div></section></main></body></html>
