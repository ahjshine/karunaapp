<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baselines · MedSentinel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head><body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><h1 class="h2 mb-3">Role baselines</h1><p class="text-muted">Changes take effect on the next detection event without restarting the application.</p><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Success</div><div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Role ID</th><th>Scope</th><th>Baseline records / 10 min</th><th>Multiplier</th><th></th></tr></thead><tbody><tr th:each="baseline : ${baselines}"><td th:text="${baseline.roleId}">1</td><td th:text="${baseline.scope}">ANY</td><td colspan="3"><form th:action="@{/admin/baselines/{id}(id=${baseline.baselineId})}" method="post" class="row g-2"><div class="col-sm-4"><input name="maxRecords" type="number" min="0" class="form-control" th:value="${baseline.maxRecordsPer10Min}"></div><div class="col-sm-4"><input name="multiplier" type="number" min="1" step="0.1" class="form-control" th:value="${baseline.multiplier}"></div><div class="col-sm-4"><button class="btn btn-primary">Save</button></div></form></td></tr></tbody></table></div></div></main></body></html>
