<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Admin · MedSentinel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head><body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><h1 class="h2 mb-3">Users and roles</h1><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Success</div><div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Username</th><th>Role</th><th>Ward ID</th><th>Shift</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="user : ${users}"><td th:text="${user.username}">user</td><td th:text="${user.role.name}">ROLE</td><td th:text="${user.wardId ?: '—'}">—</td><td th:text="${user.shiftStart + '–' + user.shiftEnd}">shift</td><td><span class="badge" th:classappend="${user.status.name() == 'ACTIVE' ? 'text-bg-success' : 'text-bg-secondary'}" th:text="${user.status}">ACTIVE</span></td><td><form th:action="@{/admin/users/{id}/toggle(id=${user.userId})}" method="post"><button class="btn btn-sm btn-outline-secondary" th:text="${user.status.name() == 'ACTIVE' ? 'Disable' : 'Enable'}">Toggle</button></form></td></tr></tbody></table></div></div></main></body></html>
