<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scenario Simulator · MedSentinel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head><body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><h1 class="h2">Scenario Simulator</h1><p class="text-muted">Generate deterministic normal and attack activity for the demo. Review results from the Reviewer Dashboard.</p><div id="result" class="alert alert-info d-none" role="status"></div><div class="row g-3"><div class="col-md-6" th:each="scenario : ${scenarios}"><div class="card shadow-sm h-100"><div class="card-body"><h2 class="h5" th:text="${scenario.name}">Scenario</h2><p class="text-muted" th:text="${scenario.description}">description</p><button class="btn btn-primary scenario-button" th:attr="data-endpoint=${scenario.endpoint}">Run scenario</button></div></div></div></div></main><script th:src="@{/js/simulator.js}"></script></body></html>
