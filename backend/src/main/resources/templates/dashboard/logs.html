<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log Explorer · MedSentinel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head><body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><h1 class="h2 mb-3">Log Explorer</h1><div class="card shadow-sm mb-4"><div class="card-body"><form class="row g-2" method="get"><div class="col-md-4"><select class="form-select" name="userId"><option value="">All users</option><option th:each="user : ${users}" th:value="${user.userId}" th:text="${user.username}">user</option></select></div><div class="col-md-3"><button class="btn btn-primary">Filter logs</button></div></form></div></div><div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover table-sm mb-0"><thead><tr><th>ID</th><th>Timestamp</th><th>User</th><th>IP</th><th>Action</th><th>Resource</th><th>Patient</th><th>Outcome</th><th>Reason</th></tr></thead><tbody><tr th:each="log : ${logs}"><td th:text="${log.logId}">1</td><td th:text="${#temporals.format(log.ts,'dd MMM HH:mm:ss.SSS')}">time</td><td th:text="${log.usernameAttempted}">user</td><td th:text="${log.ip}">ip</td><td th:text="${log.action}">VIEW</td><td th:text="${log.resourceType}">CLINICAL</td><td th:text="${log.patientId}">1</td><td><span class="badge" th:classappend="${log.outcome.name() == 'ALLOWED' ? 'text-bg-success' : (log.outcome.name() == 'DENIED' ? 'text-bg-warning' : 'text-bg-danger')}" th:text="${log.outcome}">ALLOWED</span></td><td th:text="${log.reason}">reason</td></tr><tr th:if="${#lists.isEmpty(logs)}"><td colspan="9" class="text-center text-muted py-4">No matching logs.</td></tr></tbody></table></div></div></main></body></html>
