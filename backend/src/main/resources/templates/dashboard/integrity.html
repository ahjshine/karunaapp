<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Integrity Check · MedSentinel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head><body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-5"><div class="card shadow-sm mx-auto" style="max-width: 720px"><div class="card-body text-center p-5"><div th:if="${integrityResult.intact}" class="text-success"><div class="integrity-icon">✓</div><h1 class="h2">Hash chain intact</h1><p>All <strong th:text="${integrityResult.totalRows}">0</strong> audit-log rows passed verification.</p></div><div th:unless="${integrityResult.intact}" class="text-danger"><div class="integrity-icon">!</div><h1 class="h2">Integrity violation detected</h1><p>The first broken row is log ID <strong th:text="${integrityResult.brokenAtLogId}">0</strong>.</p><p class="text-muted">Stop relying on this log sequence until the incident is investigated.</p></div><a th:href="@{/dashboard}" class="btn btn-outline-primary mt-3">Back to dashboard</a></div></div></main></body></html>
