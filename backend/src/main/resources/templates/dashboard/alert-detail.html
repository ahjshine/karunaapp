<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alert Detail · MedSentinel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head><body class="bg-light"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><a th:href="@{/dashboard}" class="btn btn-sm btn-outline-secondary mb-3">← Dashboard</a><div class="card shadow-sm mb-4"><div class="card-body"><div class="d-flex justify-content-between"><div><h1 class="h3">Alert A-<span th:text="${alert.alertId}">1</span></h1><p th:text="${alert.explanation}" class="lead">Explanation</p></div><span class="badge align-self-start fs-6" th:classappend="${alert.severity.name() == 'HIGH' ? 'text-bg-danger' : (alert.severity.name() == 'MEDIUM' ? 'text-bg-warning' : 'text-bg-info')}" th:text="${alert.severity}">HIGH</span></div><dl class="row mb-0"><dt class="col-sm-3">Rules</dt><dd class="col-sm-9" th:text="${alert.ruleCodes}">R1</dd><dt class="col-sm-3">Risk score</dt><dd class="col-sm-9" th:text="${alert.score}">30</dd><dt class="col-sm-3">Events grouped</dt><dd class="col-sm-9" th:text="${alert.eventCount}">1</dd><dt class="col-sm-3">Status</dt><dd class="col-sm-9" th:text="${alert.status}">OPEN</dd></dl></div></div><div class="card shadow-sm mb-4"><div class="card-header bg-white"><strong>Reviewer action</strong></div><div class="card-body"><form th:action="@{/dashboard/alerts/{id}/action(id=${alert.alertId})}" method="post" class="row g-2"><div class="col-md-4"><select name="action" class="form-select"><option value="acknowledge">Acknowledge</option><option value="escalate">Escalate</option><option value="false_positive">Mark false positive</option></select></div><div class="col-md-6"><input name="note" class="form-control" placeholder="Optional reviewer note"></div><div class="col-md-2"><button class="btn btn-primary w-100">Save</button></div></form></div></div><div class="card shadow-sm"><div class="card-header bg-white"><strong>Evidence log rows</strong></div><div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>ID</th><th>Time</th><th>User</th><th>Action</th><th>Resource</th><th>Outcome</th><th>Reason</th></tr></thead><tbody><tr th:each="log : ${evidenceLogs}"><td th:text="${log.logId}">1</td><td th:text="${#temporals.format(log.ts,'dd MMM HH:mm:ss')}">time</td><td th:text="${log.usernameAttempted}">user</td><td th:text="${log.action}">VIEW</td><td th:text="${log.resourceType}">CLINICAL</td><td th:text="${log.outcome}">DENIED</td><td th:text="${log.reason}">reason</td></tr><tr th:if="${#lists.isEmpty(evidenceLogs)}"><td colspan="7" class="text-center text-muted">No evidence rows available.</td></tr></tbody></table></div></div></main></body></html>
