services:
  mysql:
    image: mysql:8.4
    container_name: medsentinel-mysql
    environment:
      MYSQL_DATABASE: medsentinel
      MYSQL_USER: app_user
      MYSQL_PASSWORD: medsentinel123
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/triggers.sql:/docker-entrypoint-initdb.d/02-triggers.sql:ro
      - ./db/procedures.sql:/docker-entrypoint-initdb.d/03-procedures.sql:ro
      - ./db/views.sql:/docker-entrypoint-initdb.d/04-views.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/05-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: medsentinel-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_PASS: medsentinel123
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medsentinel?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    ports:
      - "8080:8080"

volumes:
  mysql-data:
