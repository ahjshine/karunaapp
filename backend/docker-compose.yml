services:
  mongo:
    image: mongo:7.0
    container_name: medsentinel-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: medsentinel-app
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/medsentinel
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  mongo-data:
